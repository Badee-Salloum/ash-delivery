# Build the driver's Android shell.
#
# Manual only. This is not part of the PR gate: the shell changes rarely — a UI fix still ships by
# web deploy and a driver tapping «تحديث», because the APK loads the deployed site rather than
# bundling it — and an Android toolchain on every pull request would cost minutes to prove nothing.
#
# It also exists because nobody on this project has the Android SDK installed. The APK is produced
# here, downloaded from the run, and sideloaded onto the handsets.
name: android

on:
  # `workflow_dispatch` alone is not enough: GitHub only offers it once the workflow file is on the
  # DEFAULT branch, and this lives on a feature branch. The push trigger is what makes the APK
  # buildable today, and it is scoped so ordinary work never pays for an Android toolchain.
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      driverUrl:
        description: 'Which deployment the shell loads'
        required: true
        default: 'https://ash-driver.vercel.app'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          # The action's old default also requested the retired SDK package named `tools`.
          # Platform tools are all Capacitor/Gradle needs; Gradle installs its pinned SDK itself.
          packages: platform-tools

      - name: install capacitor
        working-directory: android
        run: npm install

      # The platform is generated, never committed: `cap add android` writes a few thousand files
      # that nobody would review. What the repository holds is only what we wrote — native Java
      # files, two string resources, an offline page and the script that places them.
      - name: generate the android platform
        working-directory: android
        env:
          ASH_DRIVER_URL: ${{ inputs.driverUrl || 'https://ash-driver.vercel.app' }}
        run: npx cap add android

      - name: apply our native sources
        working-directory: android
        run: node apply-native.mjs

      - name: assemble debug for source validation
        if: github.event_name == 'push'
        working-directory: android/android
        run: ./gradlew --no-daemon assembleDebug

      - name: prepare persistent release signing
        if: github.event_name == 'workflow_dispatch'
        working-directory: android/android
        env:
          ASH_ANDROID_KEYSTORE_B64: ${{ secrets.ASH_ANDROID_KEYSTORE_B64 }}
          ASH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ASH_ANDROID_KEYSTORE_PASSWORD }}
          ASH_ANDROID_KEY_ALIAS: ${{ secrets.ASH_ANDROID_KEY_ALIAS }}
          ASH_ANDROID_KEY_PASSWORD: ${{ secrets.ASH_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ASH_ANDROID_KEYSTORE_B64"
          test -n "$ASH_ANDROID_KEYSTORE_PASSWORD"
          test -n "$ASH_ANDROID_KEY_ALIAS"
          test -n "$ASH_ANDROID_KEY_PASSWORD"
          printf '%s' "$ASH_ANDROID_KEYSTORE_B64" | base64 --decode > app/ash-release.jks
          cat >> app/build.gradle <<'GRADLE'
          android {
            signingConfigs {
              ashRelease {
                storeFile file('ash-release.jks')
                storePassword System.getenv('ASH_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ASH_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ASH_ANDROID_KEY_PASSWORD')
              }
            }
            buildTypes { release { signingConfig signingConfigs.ashRelease } }
          }
          GRADLE

      - name: assemble signed release
        if: github.event_name == 'workflow_dispatch'
        working-directory: android/android
        env:
          ASH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ASH_ANDROID_KEYSTORE_PASSWORD }}
          ASH_ANDROID_KEY_ALIAS: ${{ secrets.ASH_ANDROID_KEY_ALIAS }}
          ASH_ANDROID_KEY_PASSWORD: ${{ secrets.ASH_ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: ash-driver-debug-build-check
          path: android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ash-driver-signed-release-apk
          path: android/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
